spring.application.name=atletahub-backend

# --- SERVIDOR (Render injeta a variável PORT) ---
server.port=${PORT:8080}
# Ao receber SIGTERM (deploy/restart), termina as requisições em andamento antes de desligar
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
# Atrás do proxy do Render, o Spring passa a enxergar HTTPS e o host corretos
server.forward-headers-strategy=framework

# --- FORÇANDO O DRIVER DO POSTGRES (A Correção) ---
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# --- CONEXÃO COM O BANCO (NeonDB) ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# Hoje: update (igual ao que já roda). Para testar o modo seguro, defina JPA_DDL_AUTO=validate
# nas variáveis do Render (ou numa branch do Neon) e volte atrás se a app não subir. Sem mexer em código.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}

# --- SEGURANÇA ---
api.security.token.secret=${API_SECURITY_TOKEN_SECRET}
# Duração do token de acesso, em minutos (120 = 2h, como antes)
api.security.token.expiration-minutes=${API_SECURITY_TOKEN_EXPIRATION_MINUTES:120}

# --- CORS (origens separadas por vírgula) ---
# Web (Vercel), desenvolvimento local e app Capacitor (iOS: capacitor://localhost | Android: https://localhost)
# Para trocar sem mexer em código, defina CORS_ALLOWED_ORIGINS no Render.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://atleta-hub.vercel.app,http://localhost:5173,http://localhost:8080,https://localhost,capacitor://localhost}

# --- SWAGGER / OPENAPI ---
# Desligado por padrão. Para usar localmente: SWAGGER_ENABLED=true
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# --- CLOUDINARY ---
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api_key=${CLOUDINARY_API_KEY}
cloudinary.api_secret=${CLOUDINARY_API_SECRET}

# --- HIKARI (OBRIGATÓRIO PARA RENDER + NEON) ---
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.keepalive-time=300000

# ==================================================
# === FEATURE FLAG - TRADUÇÃO ======================
# ==================================================

# Ativa/desativa tradução automática (AWS hoje, outro amanhã)
traducao.automatica=true

# Idioma padrão de destino quando não informado explicitamente
traducao.idioma-padrao-destino=en

# --- CONFIGURAÇÃO DE UPLOAD DE ARQUIVOS ---
# Aumenta o limite para aceitar fotos de alta resolução e vídeos curtos
# (Lote 3: trocar por upload assinado direto no Cloudinary e baixar estes limites)
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
spring.servlet.multipart.enabled=true

# CONFIGURAÇÃO MONGODB (VITRINE)
# Diz para o Spring pegar a URL da variável de ambiente MONGO
spring.data.mongodb.uri=${MONGODB_URI}
